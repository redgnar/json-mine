# Module boundaries — enforced in CI (make deptrac).
#
# Contract  = the public surface: Source, TreeMapper, results, JsonPointer, Coercion
# Builder   = MapperBuilder, the only place allowed to wire everything together
# Attribute = mapping attributes; must stay dependency-free
# Tree/Schema/Validation are peers — none of them may reach into Mapping.
deptrac:
  paths:
    - src
  layers:
    - name: Attribute
      collectors:
        - type: classLike
          value: ^Ingot\\Attribute\\
    - name: Error
      collectors:
        - type: classLike
          value: ^Ingot\\Error\\
    - name: Schema
      collectors:
        - type: classLike
          value: ^Ingot\\Schema\\
    - name: Validation
      collectors:
        - type: classLike
          value: ^Ingot\\Validation\\
    - name: Mapping
      collectors:
        - type: classLike
          value: ^Ingot\\Mapping\\
    - name: SchemaGen
      collectors:
        - type: classLike
          value: ^Ingot\\SchemaGen\\
    - name: Tree
      collectors:
        - type: classLike
          value: ^Ingot\\Tree\\
    - name: Builder
      collectors:
        - type: classLike
          value: ^Ingot\\MapperBuilder$
    - name: Contract
      collectors:
        - type: classLike
          value: ^Ingot\\(?!MapperBuilder$)[A-Za-z]+$
  ruleset:
    Attribute: ~
    Error: [Contract]
    Contract: [Error, Schema]
    Schema: [Contract, Error]
    Validation: [Contract, Error]
    Mapping: [Contract, Error, Schema, Validation, Attribute]
    SchemaGen: [Mapping, Schema]
    Tree: [Contract, Error]
    Builder: [Contract, Mapping, Schema, Validation]
